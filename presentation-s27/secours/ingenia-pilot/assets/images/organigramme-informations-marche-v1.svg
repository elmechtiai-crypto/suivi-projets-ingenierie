<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Organisation des informations d’un marché ou dossier</title>
  <desc id="desc">Un marché ou dossier est organisé en trois groupes : identification, suivi et action.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#123153" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1500" height="980" fill="#F7FAFD"/>
  <text x="750" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#123153">Organiser les informations du marché ou du dossier</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(500 100)" filter="url(#shadow)">
      <rect width="500" height="120" rx="28" fill="#123153"/>
      <text x="250" y="52" text-anchor="middle" font-size="31" font-weight="700" fill="#FFFFFF">Marché ou dossier</text>
      <text x="250" y="88" text-anchor="middle" font-size="20" fill="#EAF2F8">Une fiche synthétique, sans remplacer les documents officiels</text>
    </g>
    <path d="M750 220 V285 M260 285 H1240 M260 285 V340 M750 285 V340 M1240 285 V340" fill="none" stroke="#C7A24B" stroke-width="7"/>
    <g transform="translate(45 340)" filter="url(#shadow)">
      <rect width="430" height="540" rx="28" fill="#FFFFFF" stroke="#BFD5EA" stroke-width="3"/>
      <rect width="430" height="92" rx="28" fill="#EAF2F8"/><rect y="64" width="430" height="28" fill="#EAF2F8"/>
      <text x="215" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#123153">1. Identification</text>
      <g font-size="23" fill="#24384D">
        <circle cx="48" cy="145" r="9" fill="#C7A24B"/><text x="75" y="153">Maître d’ouvrage ou client</text>
        <circle cx="48" cy="207" r="9" fill="#C7A24B"/><text x="75" y="215">Numéro de marché ou dossier</text>
        <circle cx="48" cy="269" r="9" fill="#C7A24B"/><text x="75" y="277">Objet du marché ou mission</text>
        <circle cx="48" cy="331" r="9" fill="#C7A24B"/><text x="75" y="339">Type de mission</text>
        <circle cx="48" cy="393" r="9" fill="#C7A24B"/><text x="75" y="401">Date de début</text>
        <circle cx="48" cy="455" r="9" fill="#C7A24B"/><text x="75" y="463">Délai et échéance</text>
        <circle cx="48" cy="517" r="9" fill="#C7A24B"/><text x="75" y="525">Montant HT ou TTC</text>
      </g>
    </g>
    <g transform="translate(535 340)" filter="url(#shadow)">
      <rect width="430" height="540" rx="28" fill="#FFFFFF" stroke="#BFD5EA" stroke-width="3"/>
      <rect width="430" height="92" rx="28" fill="#EAF2F8"/><rect y="64" width="430" height="28" fill="#EAF2F8"/>
      <text x="215" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#123153">2. Suivi</text>
      <g font-size="23" fill="#24384D">
        <circle cx="48" cy="170" r="9" fill="#C7A24B"/><text x="75" y="178">Avancement actualisé</text>
        <circle cx="48" cy="250" r="9" fill="#C7A24B"/><text x="75" y="258">Livrable bloquant</text>
        <circle cx="48" cy="330" r="9" fill="#C7A24B"/><text x="75" y="338">Facturation ou paiement</text>
        <circle cx="48" cy="410" r="9" fill="#C7A24B"/><text x="75" y="418">Dernière mise à jour</text>
      </g>
      <rect x="42" y="460" width="346" height="54" rx="16" fill="#FFF7DF"/>
      <text x="215" y="494" text-anchor="middle" font-size="19" font-weight="600" fill="#7A5A12">Avancement ≠ paiement</text>
    </g>
    <g transform="translate(1025 340)" filter="url(#shadow)">
      <rect width="430" height="540" rx="28" fill="#123153"/>
      <rect width="430" height="92" rx="28" fill="#C7A24B"/><rect y="64" width="430" height="28" fill="#C7A24B"/>
      <text x="215" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#123153">3. Action</text>
      <g font-size="23" fill="#FFFFFF">
        <circle cx="48" cy="180" r="9" fill="#C7A24B"/><text x="75" y="188">Action prioritaire</text>
        <circle cx="48" cy="275" r="9" fill="#C7A24B"/><text x="75" y="283">Responsable identifié</text>
        <circle cx="48" cy="370" r="9" fill="#C7A24B"/><text x="75" y="378">Prochain contrôle</text>
      </g>
      <path d="M80 460 H350" stroke="#C7A24B" stroke-width="6"/>
      <text x="215" y="505" text-anchor="middle" font-size="21" font-weight="600" fill="#EAF2F8">Une information utile</text>
      <text x="215" y="535" text-anchor="middle" font-size="21" font-weight="600" fill="#EAF2F8">conduit à une action claire.</text>
    </g>
  </g>
  <text x="750" y="935" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#52657A">Schéma de démonstration : aucun nom, numéro ou montant réel n’est affiché.</text>
</svg>
