<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Cycle de suivi des projets d’ingénierie</title>
  <desc id="desc">Cinq étapes successives : comprendre, préparer, agir, vérifier et continuer.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C7A24B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123153" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1600" height="620" fill="#F7FAFD"/>
  <text x="800" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#123153">Cycle simple de suivi</text>
  <text x="800" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#52657A">Une méthode régulière pour transformer les informations en actions</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(55 180)" filter="url(#shadow)">
      <rect width="250" height="265" rx="28" fill="#FFFFFF" stroke="#BFD5EA" stroke-width="3"/>
      <circle cx="125" cy="65" r="38" fill="#123153"/><text x="125" y="76" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">1</text>
      <text x="125" y="135" text-anchor="middle" font-size="28" font-weight="700" fill="#123153">Comprendre</text>
      <text x="125" y="180" text-anchor="middle" font-size="19" fill="#52657A"><tspan x="125">Identifier le besoin</tspan><tspan x="125" dy="30">et les informations utiles</tspan></text>
    </g>
    <path d="M315 312 H360" stroke="#C7A24B" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(375 180)" filter="url(#shadow)">
      <rect width="250" height="265" rx="28" fill="#FFFFFF" stroke="#BFD5EA" stroke-width="3"/>
      <circle cx="125" cy="65" r="38" fill="#123153"/><text x="125" y="76" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">2</text>
      <text x="125" y="135" text-anchor="middle" font-size="28" font-weight="700" fill="#123153">Préparer</text>
      <text x="125" y="180" text-anchor="middle" font-size="19" fill="#52657A"><tspan x="125">Définir les champs</tspan><tspan x="125" dy="30">et les règles de saisie</tspan></text>
    </g>
    <path d="M635 312 H680" stroke="#C7A24B" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(695 180)" filter="url(#shadow)">
      <rect width="250" height="265" rx="28" fill="#FFFFFF" stroke="#BFD5EA" stroke-width="3"/>
      <circle cx="125" cy="65" r="38" fill="#C7A24B"/><text x="125" y="76" text-anchor="middle" font-size="32" font-weight="700" fill="#123153">3</text>
      <text x="125" y="135" text-anchor="middle" font-size="28" font-weight="700" fill="#123153">Agir</text>
      <text x="125" y="180" text-anchor="middle" font-size="19" fill="#52657A"><tspan x="125">Renseigner et</tspan><tspan x="125" dy="30">actualiser sans inventer</tspan></text>
    </g>
    <path d="M955 312 H1000" stroke="#C7A24B" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(1015 180)" filter="url(#shadow)">
      <rect width="250" height="265" rx="28" fill="#FFFFFF" stroke="#BFD5EA" stroke-width="3"/>
      <circle cx="125" cy="65" r="38" fill="#123153"/><text x="125" y="76" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">4</text>
      <text x="125" y="135" text-anchor="middle" font-size="28" font-weight="700" fill="#123153">Vérifier</text>
      <text x="125" y="180" text-anchor="middle" font-size="19" fill="#52657A"><tspan x="125">Contrôler blocages,</tspan><tspan x="125" dy="30">avancement et actions</tspan></text>
    </g>
    <path d="M1275 312 H1320" stroke="#C7A24B" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(1335 180)" filter="url(#shadow)">
      <rect width="220" height="265" rx="28" fill="#123153"/>
      <circle cx="110" cy="65" r="38" fill="#C7A24B"/><text x="110" y="76" text-anchor="middle" font-size="32" font-weight="700" fill="#123153">5</text>
      <text x="110" y="135" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Continuer</text>
      <text x="110" y="180" text-anchor="middle" font-size="19" fill="#EAF2F8"><tspan x="110">Mettre à jour</tspan><tspan x="110" dy="30">et améliorer</tspan></text>
    </g>
  </g>
  <path d="M1445 465 C1420 550 220 555 175 465" fill="none" stroke="#BFD5EA" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <text x="800" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#52657A">Le suivi est un cycle : la dernière mise à jour prépare la prochaine lecture.</text>
</svg>
